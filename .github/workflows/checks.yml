# Every push: type check, design tokens, the full test suite on a fresh database, then the desktop
# browser journeys against a built app. All on sample data with stand-in services: no live keys,
# no production data. (The Vercel build also runs scripts/gate.mjs, which blocks a bad deploy.)
name: Checks

on:
  push:
  pull_request:

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: abm
          POSTGRES_PASSWORD: abm
          POSTGRES_DB: abm_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U abm" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://abm:abm@localhost:5432/abm_test?schema=public
      E2E_DATABASE_URL: postgresql://abm:abm@localhost:5432/abm_e2e?schema=public
      DATABASE_URL: postgresql://abm:abm@localhost:5432/abm_e2e?schema=public
      AUTH_SECRET: e2e-secret
      ADAPTER_MODE: mock
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Type check
        run: npx tsc --noEmit
      - name: Design tokens
        run: node scripts/check-tokens.mjs
      - name: Test database schema
        run: DATABASE_URL=$TEST_DATABASE_URL npx prisma db push --skip-generate --accept-data-loss
      - name: Full test suite
        run: npx vitest run
      - name: Build
        run: npm run build
      - name: Browser journeys
        run: |
          npm i --no-save playwright@1
          npx playwright install --with-deps chromium
          npm run test:e2e
